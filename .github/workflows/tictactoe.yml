name: Tic Tac Toe source

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tictactoe-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install CMake compatible with the existing project requirement
        run: |
          python3 -m venv "$RUNNER_TEMP/tictactoe-tools"
          "$RUNNER_TEMP/tictactoe-tools/bin/python" -m pip install 'cmake==4.4.4'
          echo "$RUNNER_TEMP/tictactoe-tools/bin" >> "$GITHUB_PATH"
      - name: Verify scoped native Tic Tac Toe contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cpp-level2-tictactoe-source-ci
        run: python3 verify-tictactoe-project.py
